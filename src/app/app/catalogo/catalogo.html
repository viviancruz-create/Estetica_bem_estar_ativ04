<div class="container my-4">
  <h2 class="text-center mb-4" style="color: var(--verde-escuro);">Nosso Catálogo</h2>

  <!-- Seção de Produtos -->
  <h3 class="mb-3" style="color: var(--rosa-escuro);">Produtos</h3>
  <div class="row">
    <div class="col-md-4 mb-4" *ngFor="let p of produtos">
      <div class="card h-100 shadow-sm border-0" style="background-color: var(--creme-suave);">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title fw-bold" style="color: var(--verde-escuro);">
            {{ p.iditemNavigation?.item1 || 'Produto' }}
          </h5>
          <p class="card-text text-muted">
            {{ p.iditemNavigation?.descricaoItem || 'Sem descrição cadastrada' }}
          </p>
          <p class="fw-bold fs-5 mt-auto text-success">
            R$ {{ (p.precoVenda || p.iditemNavigation?.preco || 0).toFixed(2) }}
          </p>
          <button class="btn text-white w-100 fw-bold mt-2" style="background-color: var(--rosa-principal);" (click)="adicionarProduto(p)">
            Adicionar ao Carrinho
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Seção de Serviços -->
  <h3 class="my-3" style="color: var(--rosa-escuro);">Serviços</h3>
  <div class="row">
    <div class="col-md-4 mb-4" *ngFor="let s of servicos">
      <div class="card h-100 shadow-sm border-0" style="background-color: var(--creme-suave);">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title fw-bold" style="color: var(--verde-escuro);">{{ s.nome }}</h5>
          <p class="card-text text-muted">{{ s.descricao }}</p>
          <p class="fw-bold fs-5 mt-auto text-success">R$ {{ s.preco.toFixed(2) }}</p>
          <button class="btn text-white w-100 fw-bold mt-2" style="background-color: var(--verde-oliva);" (click)="adicionarServico(s)">
            Agendar / Adicionar
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
