<div class="container my-4" style="max-width: 600px;">
    <h2 class="text-center mb-4">Cadastro de Cliente</h2>
  
    <form (ngSubmit)="salvar()">
      <div class="mb-3">
        <label class="form-label">Nome Completo</label>
        <input type="text" class="form-control" [(ngModel)]="cliente.nome" name="nome" required>
      </div>
  
      <div class="mb-3">
        <label class="form-label">E-mail</label>
        <input type="email" class="form-control" [(ngModel)]="cliente.email" name="email" required>
      </div>
  
      <div class="mb-3">
        <label class="form-label">Telefone</label>
        <input type="tel" class="form-control" [(ngModel)]="cliente.telefone" name="telefone">
      </div>
  
      <div class="mb-3">
        <label class="form-label">Endereço</label>
        <input type="text" class="form-control" [(ngModel)]="cliente.endereco" name="endereco">
      </div>
  
      <button type="submit" class="btn btn-primary w-100">Salvar Cadastro</button>
    </form>
  </div>
